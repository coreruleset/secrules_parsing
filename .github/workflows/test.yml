---
name: Regression Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        poetry-version: ['2.2.1']
        crsversion: ['4.23.0', '3.3.8', '3.2.1']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: ${{ matrix.poetry-version }}
      - name: "Run tests"
        run: |
          curl -L https://github.com/coreruleset/coreruleset/archive/refs/tags/v${{ matrix.crsversion }}.tar.gz -o - | tar xzvf - --strip-components=1 --wildcards "*/rules/*"
          poetry install -v --with dev
          poetry run pytest -vs
          poetry run secrules-parser -c --output-type github -f rules/*.conf
